name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  lint-and-build:
    name: Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_PUBLIC_STELLAR_NETWORK: testnet

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_API_URL: http://localhost:9999
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_E2E_WALLET: "true"
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: test
          NEXT_PUBLIC_CLOUDINARY_API_KEY: test
          NEXT_PUBLIC_CLOUDINARY_API_SECRET: test
          NEXT_PUBLIC_CLOUDINARY_URL: https://test.cloudinary.com
          NEXT_PUBLIC_JITSI_DOMAIN: https://meet.jit.si
          DNB_API_URL: http://localhost:9999
          NEXT_PUBLIC_SOCKET_URL: http://localhost:9999

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
