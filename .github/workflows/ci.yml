name: CI
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  lint-and-build:
    name: Lint and Build
    runs-on: ubuntu-latest
    # A hung test run used to burn the full 6-hour default before cancelling.
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.14.0'
          cache: 'npm'
      
      - name: Verify Node.js and npm versions
        run: |
          test "$(node --version)" = "v22.14.0"
          test "$(npm --version)" = "10.9.2"

      - name: Verify lockfile enforcement
        run: node --test .github/workflows/ci-install.test.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check mobile store configuration
        run: npm run mobile:preflight

      - name: Run ESLint
        run: npm run lint

      - name: Validate locale catalogs
        run: npm run i18n:check
      
      - name: Run accessibility gate
        run: npm run a11y

      - name: Run launch-content gate
        run: npm run check:launch-content
      
      - name: Run type check
        run: npm run typecheck
      
      # #523 — explicit-`any` guardrail. Fails when the tracked count of
      # explicit `any` sites grows, or when an eslint-disable for the rule
      # loses its `-- <reason>` justification.
      - name: Guard explicit-any count
        run: npm run lint:any

      - name: Validate unit release profile
        run: npm run release:check
        env:
          RELEASE_PROFILE: unit

      - name: Guard production image host allowlist
        run: npm run check:image-hosts
      
      - name: Run component tests
        run: npm test
      
      - name: Build application
        run: npm run build
        env:
          RELEASE_PROFILE: integration
          NEXT_PUBLIC_API_URL: https://dnb-backend-api.onrender.com
          # CI builds against a deployed-like backend; strict staging and
          # production profiles are covered by the release checks below and
          # by the environment tests.
          NEXT_PUBLIC_APP_ENV: development
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_USDC_ISSUER: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
          # The app's type-check + page-data pass outgrew Node's default heap
          # (the build aborts with "JavaScript heap out of memory").
          NODE_OPTIONS: --max-old-space-size=6144
          # Optional -- Sentry source-map upload auto-skips when the token is
          # absent, so CI stays green without these secrets configured.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Enforce emitted asset budget
        run: npm run budget

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.14.0'
          cache: 'npm'

      - name: Verify Node.js and npm versions
        run: |
          test "$(node --version)" = "v22.14.0"
          test "$(npm --version)" = "10.9.2"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      # #489 -- Browser binaries are cached per installed Playwright version
      # (read from the resolved node_modules/@playwright/test entry, i.e. the
      # version pinned in package-lock.json), so unrelated lockfile changes
      # do not invalidate the cache. No restore-keys: a stale browser build
      # must never be reused with a different Playwright version.
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # Cache miss: download browsers and install OS dependencies.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Cache hit: browsers are restored, but OS packages live outside the
      # cached path, so they still need installing.
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Validate integration release profile
        run: npm run release:check
        env:
          RELEASE_PROFILE: integration
          NEXT_PUBLIC_API_URL: https://dnb-backend-api.onrender.com
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_USDC_ISSUER: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5

      - name: Build application
        run: npm run build
        env:
          RELEASE_PROFILE: integration
          NEXT_PUBLIC_API_URL: https://dnb-backend-api.onrender.com
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_USDC_ISSUER: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
          # The app's type-check + page-data pass outgrew Node's default heap
          # (the build aborts with "JavaScript heap out of memory").
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Start production server
        run: |
          npx next start -p 3123 > /tmp/next-e2e.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3123 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/next-e2e.log
          exit 1

      - name: Run i18n E2E specs
        run: npm run test:e2e
        env:
          E2E_PORT: 3123

      - name: Run admin E2E specs
        run: npm run test:e2e:admin
        env:
          E2E_PORT: 3123

      - name: Run production smoke contract
        run: npm run test:e2e:smoke
        env:
          SMOKE_BASE_URL: http://localhost:3123
          SMOKE_RUN_ID: ci-${{ github.run_id }}

      - name: Verify security headers
        run: npm run check:security-headers
        env:
          SECURITY_HEADERS_URL: http://localhost:3123

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.14.0'
          cache: 'npm'
      
      - name: Verify Node.js and npm versions
        run: |
          test "$(node --version)" = "v22.14.0"
          test "$(npm --version)" = "10.9.2"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Validate production preflight profile
        run: npm run release:check
        env:
          RELEASE_PROFILE: production
          NEXT_PUBLIC_API_URL: https://dnb-backend-api.onrender.com
          NEXT_PUBLIC_STELLAR_NETWORK: mainnet
          NEXT_PUBLIC_USDC_ISSUER: GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN

      - name: Build application
        run: npm run build
        env:
          RELEASE_PROFILE: production
          NEXT_PUBLIC_API_URL: https://dnb-backend-api.onrender.com
          NEXT_PUBLIC_STELLAR_NETWORK: mainnet
          NEXT_PUBLIC_USDC_ISSUER: GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN
          # The app's type-check + page-data pass outgrew Node's default heap
          # (the build aborts with "JavaScript heap out of memory").
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Start production server
        run: |
          npx next start &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then
              break
            fi
            sleep 2
          done

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true

      - name: Run Lighthouse CI (mobile)
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        env:
          LHCI_COLLECT_SETTINGS__PRESET: mobile
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
