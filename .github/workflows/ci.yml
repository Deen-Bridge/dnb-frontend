name: CI
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  lint-and-build:
    name: Lint and Build
    runs-on: ubuntu-latest
    # A hung test run used to burn the full 6-hour default before cancelling.
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund
      
      - name: Run ESLint
        run: npm run lint
      
      - name: Run accessibility gate
        run: npm run a11y
      
      - name: Run type check
        run: npm run typecheck
      
      # #523 — explicit-`any` guardrail. Fails when the tracked count of
      # explicit `any` sites grows, or when an eslint-disable for the rule
      # loses its `-- <reason>` justification.
      - name: Guard explicit-any count
        run: npm run lint:any
      
      - name: Run component tests
        run: npm test
      
      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          # Optional -- Sentry source-map upload auto-skips when the token is
          # absent, so CI stays green without these secrets configured.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund

      # #489 -- Browser binaries are cached per installed Playwright version
      # (read from the resolved node_modules/@playwright/test entry, i.e. the
      # version pinned in package-lock.json), so unrelated lockfile changes
      # do not invalidate the cache. No restore-keys: a stale browser build
      # must never be reused with a different Playwright version.
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # Cache miss: download browsers and install OS dependencies.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Cache hit: browsers are restored, but OS packages live outside the
      # cached path, so they still need installing.
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_PUBLIC_STELLAR_NETWORK: testnet

      - name: Start production server
        run: |
          npx next start -p 3123 > /tmp/next-e2e.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3123 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/next-e2e.log
          exit 1

      - name: Run i18n E2E specs
        run: npm run test:e2e
        env:
          E2E_PORT: 3123

      - name: Run admin E2E specs
        run: npm run test:e2e:admin
        env:
          E2E_PORT: 3123

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund
      
      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_PUBLIC_STELLAR_NETWORK: testnet

      - name: Start production server
        run: |
          npx next start &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then
              break
            fi
            sleep 2
          done

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
